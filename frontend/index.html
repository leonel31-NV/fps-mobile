<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14171a">
<title>Arena FPS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="view"></canvas>

<section id="lobby">
  <h1>Arena FPS</h1>
  <p class="sub">Aponte a câmera, mire e acerte seus amigos.</p>
  <input id="name" maxlength="12" placeholder="Seu apelido" autocomplete="off">
  <button id="create">Criar sala</button>
  <div class="row"><input id="code" maxlength="5" placeholder="Código" autocomplete="off"><button id="join">Entrar</button></div>
  <p id="msg" role="alert"></p>
</section>

<section id="hud" hidden>
  <div id="roomcode"></div>
  <ul id="board"></ul>
  <canvas id="radar" width="200" height="200"></canvas>
  <div id="feed"></div>
  <div id="stats"><div id="hpbar"><i id="hpfill"></i></div><div id="ammo"></div></div>
  <div id="dead" hidden>Você caiu. Voltando em instantes…</div>
  <div id="stick"><i id="knob"></i></div>
  <button id="fire">Atirar</button>
  <button id="rld">Recarregar</button>
  <button id="quit">Sair</button>
</section>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
