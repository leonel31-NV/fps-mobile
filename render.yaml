services:
  - type: web
    name: fps-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        sync: false   # informe a URL do frontend, ex.: https://fps-frontend.onrender.com

  - type: web
    name: fps-frontend
    runtime: static
    rootDir: frontend
    buildCommand: echo "window.BACKEND_URL='$BACKEND_URL';" > config.js
    staticPublishPath: .
    envVars:
      - key: BACKEND_URL
        sync: false   # informe a URL do backend, ex.: https://fps-backend.onrender.com
